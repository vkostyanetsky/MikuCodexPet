name: Release pet package

# The workflow is manual and stops at a draft: it builds the pet from the
# current commit and opens a release you can edit. No tag is needed up front --
# GitHub creates it from this commit at the moment you press Publish.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (defaults to the topmost one in CHANGELOG.md)
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --upgrade pip Pillow

      # A release nobody can read the notes of is a release worth stopping.
      - name: Read the version from the changelog
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [ -z "$VERSION" ]; then
            VERSION="$(sed -n 's/^## *\([^ ]*\).*/\1/p' CHANGELOG.md | head -n 1)"
          fi

          if ! grep -qE "^## +$VERSION( |$)" CHANGELOG.md; then
            echo "CHANGELOG.md has no section for $VERSION." >&2
            exit 1
          fi

          echo "Releasing $VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # The draft opens with the changelog section already in it, so editing the
      # notes means editing prose rather than writing it from scratch.
      - name: Collect the release notes
        run: |
          awk -v version="$VERSION" '
            $0 ~ "^## +" version "( |$)" { collecting = 1; next }
            collecting && /^## / { exit }
            collecting { print }
          ' CHANGELOG.md > notes.md

          cat notes.md

      # Rebuilds the atlas from src/miku/ and re-runs the palette, alpha and
      # geometry checks; a failed validation fails the job.
      - name: Build the atlas
        run: python tools/build_codex_pet.py --dist-dir build/dist --skip-previews

      # The archive has to unpack into ~/.codex/pets/, so its root entry is the
      # pet folder itself: miku/pet.json, miku/spritesheet.webp, miku/CREDITS.txt.
      - name: Pack the pet
        run: |
          mkdir -p build/package/miku
          cp build/dist/miku/pet.json \
             build/dist/miku/spritesheet.webp \
             build/dist/miku/CREDITS.txt \
             build/package/miku/
          (cd build/package && zip -r ../../miku-codex-pet.zip miku)
          unzip -l miku-codex-pet.zip

      - name: Create the draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$VERSION" \
            --title="$VERSION" \
            --draft \
            --target "$GITHUB_SHA" \
            --notes-file notes.md \
            miku-codex-pet.zip
