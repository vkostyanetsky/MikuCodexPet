name: Release pet package

# The workflow is manual: it builds the pet from the tag you name and leaves a
# draft release behind, so nothing is published until you look it over.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to build the release from
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    env:
      TAG: ${{ inputs.tag }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --upgrade pip Pillow

      # A release nobody can read the notes of is a release worth stopping.
      - name: Check the tag against the changelog
        run: |
          if ! grep -qE "^## +$TAG( |$)" CHANGELOG.md; then
            echo "CHANGELOG.md has no section for the tag ($TAG)." >&2
            exit 1
          fi

      # Rebuilds the atlas from src/miku/ and re-runs the palette, alpha and
      # geometry checks; a failed validation fails the job.
      - name: Build the atlas
        run: python tools/build_codex_pet.py --dist-dir build/dist --skip-previews

      # The archive has to unpack into ~/.codex/pets/, so its root entry is the
      # pet folder itself: miku/pet.json, miku/spritesheet.webp, miku/CREDITS.txt.
      - name: Pack the pet
        run: |
          mkdir -p build/package/miku
          cp build/dist/miku/pet.json \
             build/dist/miku/spritesheet.webp \
             build/dist/miku/CREDITS.txt \
             build/package/miku/
          (cd build/package && zip -r ../../miku-codex-pet.zip miku)
          unzip -l miku-codex-pet.zip

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$TAG" \
            --title="$TAG" \
            --draft \
            miku-codex-pet.zip
